# Gateway SMPP baseado no Jasmin (https://jasminsms.com)
#
#   docker compose up -d                       -> produção (Jasmin + Redis + RabbitMQ)
#   docker compose --profile dev up -d         -> + simulador de SMSC para testes locais
#   docker compose run --rm provisionar        -> aplica config/gateway.json no Jasmin
#   docker compose --profile painel up -d      -> + Jasmin Web Panel em http://localhost:8999

name: smpp-gateway

services:
  redis:
    image: redis:7.2-alpine
    restart: unless-stopped
    command: ["redis-server", "--appendonly", "yes"]
    volumes:
      - redis-data:/data
    healthcheck:
      test: ["CMD-SHELL", "redis-cli ping | grep PONG"]
      interval: 10s
      timeout: 5s
      retries: 5
    security_opt:
      - no-new-privileges:true

  rabbitmq:
    image: rabbitmq:3.13-management-alpine
    restart: unless-stopped
    hostname: rabbitmq
    volumes:
      - rabbitmq-data:/var/lib/rabbitmq
    ports:
      # Painel de gestão do RabbitMQ, só acessível pela própria máquina
      - "127.0.0.1:${RABBITMQ_ADMIN_PORT:-15672}:15672"
    healthcheck:
      test: ["CMD", "rabbitmq-diagnostics", "-q", "ping"]
      interval: 15s
      timeout: 10s
      retries: 5
    security_opt:
      - no-new-privileges:true

  jasmin:
    image: jookies/jasmin:${JASMIN_VERSION:-0.11.0}
    restart: unless-stopped
    depends_on:
      redis:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy
    environment:
      REDIS_CLIENT_HOST: redis
      REDIS_CLIENT_PORT: 6379
      AMQP_BROKER_HOST: rabbitmq
      AMQP_BROKER_PORT: 5672
    # Liga publish_submit_sm_resp (o histórico do painel precisa dele para saber
    # se o fornecedor aceitou a mensagem) e segue para o entrypoint original.
    entrypoint:
      - /bin/bash
      - -c
      - >-
        grep -q '^publish_submit_sm_resp' $$CONFIG_PATH/jasmin.cfg ||
        sed -i '/^\[sm-listener\]/a publish_submit_sm_resp = True' $$CONFIG_PATH/jasmin.cfg;
        exec /docker-entrypoint.sh "$$@"
      - --
    # A ordem dos argumentos importa: o entrypoint da imagem olha o 2º argumento
    # para decidir se sobe o interceptord.
    command:
      - jasmind.py
      - --enable-interceptor-client
      - --enable-dlr-thrower
      - --enable-dlr-lookup
      - -u
      - ${JCLI_USER:-jcliadmin}
      - -p
      - ${JCLI_PASSWORD:-jclipwd}
    ports:
      # SMPP para os clientes (este é o único que fica exposto)
      - "${SMPP_BIND:-0.0.0.0}:${SMPP_PORT:-2775}:2775"
      # jcli (administração) e API HTTP: só pela própria máquina
      - "127.0.0.1:${JCLI_PORT:-8990}:8990"
      - "127.0.0.1:${HTTP_API_PORT:-1401}:1401"
    volumes:
      - jasmin-store:/etc/jasmin/store
      - jasmin-logs:/var/log/jasmin
    security_opt:
      - no-new-privileges:true

  # Simulador de SMSC (substitui o fornecedor nos testes locais)
  smsc-simulador:
    profiles: ["dev"]
    build: ./simulador
    restart: unless-stopped
    environment:
      SIM_SYSTEM_ID: ${SIM_SYSTEM_ID:-simulador}
      SIM_PASSWORD: ${SIM_PASSWORD:-sim123}
      SIM_ECO_PREFIXO: ${SIM_ECO_PREFIXO:-5500}
    ports:
      - "127.0.0.1:${SIM_PORT:-2776}:2775"

  # Aplica config/gateway.json no Jasmin via jcli (roda e sai)
  provisionar:
    profiles: ["tools"]
    image: python:3.12-slim
    depends_on:
      - jasmin
    working_dir: /app
    environment:
      JCLI_HOST: jasmin
      JCLI_PORT: 8990
      JCLI_USER: ${JCLI_USER:-jcliadmin}
      JCLI_PASSWORD: ${JCLI_PASSWORD:-jclipwd}
      PROVISIONAR_DEBUG: ${PROVISIONAR_DEBUG:-0}
    volumes:
      - ./provisionamento:/app:ro
      - ./config:/config:ro
    entrypoint: ["python", "-u", "provisionar.py", "/config/gateway.json"]

  # --- Jasmin Web Panel (https://github.com/101t/jasmin-web-panel) ---------

  painel:
    profiles: ["painel"]
    image: tarekaec/jasmin_web_panel:${PAINEL_VERSION:-3.1.0}
    restart: unless-stopped
    environment: &painel-env
      DJANGO_SETTINGS_MODULE: config.settings.pro
      DEBUG: "False"
      SECRET_KEY: ${PAINEL_SECRET_KEY:?defina PAINEL_SECRET_KEY no .env}
      ALLOWED_HOSTS: "*"
      TIME_ZONE: America/Sao_Paulo
      PRODB_URL: postgres://painel:${PAINEL_DB_PASSWORD:-painel}@painel-db:5432/painel
      REDIS_HOST: redis
      REDIS_PORT: 6379
      REDIS_DB: 1  # o Jasmin usa o db 0
      TELNET_HOST: jasmin
      TELNET_PORT: 8990
      TELNET_USERNAME: ${JCLI_USER:-jcliadmin}
      TELNET_PW: ${JCLI_PASSWORD:-jclipwd}
      TELNET_TIMEOUT: 10
      HTTP_HOST: http://jasmin
      HTTP_PORT: 1401
      SMPP_HOST: jasmin
      SMPP_PORT: 2775
      SUBMIT_LOG: "True"
    ports:
      - "127.0.0.1:${PAINEL_PORT:-8999}:8000"
    volumes:
      - painel-public:/app/public
      - painel-logs:/app/logs
    depends_on:
      painel-db:
        condition: service_healthy
      redis:
        condition: service_healthy
      jasmin:
        condition: service_started

  painel-celery:
    profiles: ["painel"]
    image: tarekaec/jasmin_web_panel:${PAINEL_VERSION:-3.1.0}
    restart: unless-stopped
    entrypoint: ["bash", "./docker-entrypoint-celery.sh"]
    environment: *painel-env
    healthcheck:
      disable: true
    depends_on:
      painel-db:
        condition: service_healthy
      redis:
        condition: service_healthy

  painel-db:
    profiles: ["painel"]
    image: postgres:17-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: painel
      POSTGRES_USER: painel
      POSTGRES_PASSWORD: ${PAINEL_DB_PASSWORD:-painel}
    volumes:
      - painel-db-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U painel -d painel"]
      interval: 10s
      timeout: 5s
      retries: 5

  painel-sms-logger:
    profiles: ["painel"]
    build:
      context: ./painel
      dockerfile: Dockerfile.sms_logger
      args:
        JASMIN_VERSION: ${JASMIN_VERSION:-0.11.0}
    restart: unless-stopped
    environment:
      AMQP_BROKER_HOST: rabbitmq
      AMQP_BROKER_PORT: 5672
      AMQP_SPEC_FILE: /etc/jasmin/resource/amqp0-9-1.xml
      DB_TYPE_MYSQL: 0
      DB_HOST: painel-db
      DB_DATABASE: painel
      DB_TABLE: submit_log
      DB_USER: painel
      DB_PASS: ${PAINEL_DB_PASSWORD:-painel}
    depends_on:
      rabbitmq:
        condition: service_healthy
      # A tabela submit_log é criada pelas migrations do painel; se o logger
      # subir antes, ele cria a tabela e as migrations falham.
      painel:
        condition: service_healthy
      jasmin:
        condition: service_started

volumes:
  painel-public:
  painel-logs:
  painel-db-data:
  redis-data:
  rabbitmq-data:
  jasmin-store:
  jasmin-logs:
