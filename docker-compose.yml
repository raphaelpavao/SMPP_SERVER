# Gateway SMPP baseado no Jasmin (https://jasminsms.com)
#
#   docker compose up -d                       -> produção (Jasmin + Redis + RabbitMQ)
#   docker compose --profile dev up -d         -> + simulador de SMSC para testes locais
#   docker compose run --rm provisionar        -> aplica config/gateway.json no Jasmin

name: smpp-gateway

services:
  redis:
    image: redis:7.2-alpine
    restart: unless-stopped
    command: ["redis-server", "--appendonly", "yes"]
    volumes:
      - redis-data:/data
    healthcheck:
      test: ["CMD-SHELL", "redis-cli ping | grep PONG"]
      interval: 10s
      timeout: 5s
      retries: 5
    security_opt:
      - no-new-privileges:true

  rabbitmq:
    image: rabbitmq:3.13-management-alpine
    restart: unless-stopped
    hostname: rabbitmq
    volumes:
      - rabbitmq-data:/var/lib/rabbitmq
    ports:
      # Painel de gestão do RabbitMQ, só acessível pela própria máquina
      - "127.0.0.1:${RABBITMQ_ADMIN_PORT:-15672}:15672"
    healthcheck:
      test: ["CMD", "rabbitmq-diagnostics", "-q", "ping"]
      interval: 15s
      timeout: 10s
      retries: 5
    security_opt:
      - no-new-privileges:true

  jasmin:
    image: jookies/jasmin:${JASMIN_VERSION:-0.11.0}
    restart: unless-stopped
    depends_on:
      redis:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy
    environment:
      REDIS_CLIENT_HOST: redis
      REDIS_CLIENT_PORT: 6379
      AMQP_BROKER_HOST: rabbitmq
      AMQP_BROKER_PORT: 5672
    # A ordem dos argumentos importa: o entrypoint da imagem olha o 2º argumento
    # para decidir se sobe o interceptord.
    command:
      - jasmind.py
      - --enable-interceptor-client
      - --enable-dlr-thrower
      - --enable-dlr-lookup
      - -u
      - ${JCLI_USER:-jcliadmin}
      - -p
      - ${JCLI_PASSWORD:-jclipwd}
    ports:
      # SMPP para os clientes (este é o único que fica exposto)
      - "${SMPP_BIND:-0.0.0.0}:${SMPP_PORT:-2775}:2775"
      # jcli (administração) e API HTTP: só pela própria máquina
      - "127.0.0.1:${JCLI_PORT:-8990}:8990"
      - "127.0.0.1:${HTTP_API_PORT:-1401}:1401"
    volumes:
      - jasmin-store:/etc/jasmin/store
      - jasmin-logs:/var/log/jasmin
    security_opt:
      - no-new-privileges:true

  # Simulador de SMSC (substitui o fornecedor nos testes locais)
  smsc-simulador:
    profiles: ["dev"]
    build: ./simulador
    restart: unless-stopped
    environment:
      SIM_SYSTEM_ID: ${SIM_SYSTEM_ID:-simulador}
      SIM_PASSWORD: ${SIM_PASSWORD:-sim123}
      SIM_ECO_PREFIXO: ${SIM_ECO_PREFIXO:-5500}
    ports:
      - "127.0.0.1:${SIM_PORT:-2776}:2775"

  # Aplica config/gateway.json no Jasmin via jcli (roda e sai)
  provisionar:
    profiles: ["tools"]
    image: python:3.12-slim
    depends_on:
      - jasmin
    working_dir: /app
    environment:
      JCLI_HOST: jasmin
      JCLI_PORT: 8990
      JCLI_USER: ${JCLI_USER:-jcliadmin}
      JCLI_PASSWORD: ${JCLI_PASSWORD:-jclipwd}
      PROVISIONAR_DEBUG: ${PROVISIONAR_DEBUG:-0}
    volumes:
      - ./provisionamento:/app:ro
      - ./config:/config:ro
    entrypoint: ["python", "-u", "provisionar.py", "/config/gateway.json"]

volumes:
  redis-data:
  rabbitmq-data:
  jasmin-store:
  jasmin-logs:
