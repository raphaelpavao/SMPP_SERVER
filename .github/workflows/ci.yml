name: teste-ponta-a-ponta

on:
  push:
  pull_request:

jobs:
  e2e:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: Configuração de exemplo (aponta para o simulador)
        run: |
          cp .env.example .env
          cp config/gateway.example.json config/gateway.json

      - name: Subir Jasmin + simulador
        run: docker compose --profile dev up -d --build --wait

      - name: Provisionar
        timeout-minutes: 3
        run: docker compose run --rm -T provisionar 2>&1 | tee provisionar.txt; exit ${PIPESTATUS[0]}

      - name: Enviar SMS e conferir DLR e MO
        run: |
          pip install -r ferramentas/requirements.txt
          sleep 10  # tempo para o Jasmin fazer bind no simulador
          python ferramentas/cliente_teste.py --usuario cliente1 --senha cli123 \
            --destino 5500999990001 --texto "Teste CI" --espera 10 | tee saida.txt
          grep -q "stat:DELIVRD" saida.txt
          grep -q "ECO: Teste CI" saida.txt

      # Os logs dos passos só aparecem para quem está logado no GitHub; as
      # anotações aparecem para todos, então o diagnóstico vai para elas.
      - name: Logs em caso de falha
        if: failure()
        run: |
          docker compose --profile dev logs --no-color
          anotar() { echo "::error title=$1::$(tail -c 3500 | sed ':a;N;$!ba;s/%/%25/g;s/\r//g;s/\n/%0A/g')"; }
          [ -f provisionar.txt ] && anotar provisionar < provisionar.txt
          [ -f saida.txt ] && anotar cliente_teste < saida.txt
          docker compose logs --no-color --tail 40 jasmin | anotar jasmin
          docker compose --profile dev logs --no-color --tail 20 smsc-simulador | anotar simulador
